# Workflow template. Copy this file to
# .github/workflows/multiplayer-test.yml to activate it.
name: Multiplayer Test APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "multiplayer-test/**"
      - "gba/**"
      - "SDK.zip"
      - ".github/workflows/multiplayer-test.yml"
  push:
    branches:
      - main
    paths:
      - "multiplayer-test/**"
      - "gba/**"
      - "SDK.zip"
      - ".github/workflows/multiplayer-test.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build EOS multiplayer test APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build multiplayer test APK
        env:
          EOS_PRODUCT_ID: ${{ secrets.EOS_PRODUCT_ID }}
          EOS_SANDBOX_ID: ${{ secrets.EOS_SANDBOX_ID }}
          EOS_DEPLOYMENT_ID: ${{ secrets.EOS_DEPLOYMENT_ID }}
          EOS_CLIENT_ID: ${{ secrets.EOS_CLIENT_ID }}
          EOS_CLIENT_SECRET: ${{ secrets.EOS_CLIENT_SECRET }}
        run: |
          cd multiplayer-test
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload multiplayer test APK
        uses: actions/upload-artifact@v4
        with:
          name: space-unlimited-multiplayer-test
          path: multiplayer-test/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
