name: Build & Release Game (Android APK & GBA ROM)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      custom_tag:
        description: 'Optional custom release tag (leave empty for auto-increment spaceshooter-vX)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK & GBA ROM and Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 1. GBA ROM BUILD ──
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Validate GBA source assets
        run: python3 tools/validate-assets.py

      - name: Generate GBA audio and graphics data
        run: npm run generate-assets

      - name: Compile GBA ROM (SpaceUnlimited.gba)
        run: node tools/build_gba.js

      - name: Verify GBA ROM artifact
        run: |
          test -f SpaceUnlimited.gba
          echo "GBA ROM size: $(wc -c < SpaceUnlimited.gba) bytes"

      # ── 2. NATIVE ANDROID APK BUILD ──
      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android APK via Gradle
        run: |
          cd android
          chmod +x gradlew || true
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../spaceshooter.apk
          cd $GITHUB_WORKSPACE
          test -f spaceshooter.apk
          echo "Android APK size: $(wc -c < spaceshooter.apk) bytes"

      # ── 2b. MULTIPLAYER TEST APK (EOS co-op edition) ──
      - name: Build multiplayer test APK
        env:
          EOS_PRODUCT_ID: ${{ secrets.EOS_PRODUCT_ID }}
          EOS_SANDBOX_ID: ${{ secrets.EOS_SANDBOX_ID }}
          EOS_DEPLOYMENT_ID: ${{ secrets.EOS_DEPLOYMENT_ID }}
          EOS_CLIENT_ID: ${{ secrets.EOS_CLIENT_ID }}
          EOS_CLIENT_SECRET: ${{ secrets.EOS_CLIENT_SECRET }}
        run: |
          cd multiplayer-test
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../spaceshooter-multiplayer.apk
          cd $GITHUB_WORKSPACE
          test -f spaceshooter-multiplayer.apk
          echo "Multiplayer APK size: $(wc -c < spaceshooter-multiplayer.apk) bytes"

      # ── 3. AUTO-INCREMENT VERSION & PUBLISH GITHUB RELEASE ──
      - name: Determine Next Release Version Tag
        id: versioning
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CUSTOM_TAG="${{ github.event.inputs.custom_tag }}"
          if [ -n "$CUSTOM_TAG" ]; then
            TAG_NAME="$CUSTOM_TAG"
          else
            RELEASES=$(gh release list --limit 100 --json tagName -q '.[].tagName' || true)
            HIGHEST_NUM=0
            for tag in $RELEASES; do
              if [[ $tag =~ (spaceshooter|game)-v([0-9]+) ]]; then
                NUM="${BASH_REMATCH[2]}"
                if [ "$NUM" -gt "$HIGHEST_NUM" ]; then
                  HIGHEST_NUM=$NUM
                fi
              elif [[ $tag =~ v([0-9]+) ]]; then
                NUM="${BASH_REMATCH[1]}"
                if [ "$NUM" -gt "$HIGHEST_NUM" ]; then
                  HIGHEST_NUM=$NUM
                fi
              fi
            done
            NEXT_NUM=$((HIGHEST_NUM + 1))
            TAG_NAME="spaceshooter-v${NEXT_NUM}"
          fi
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
