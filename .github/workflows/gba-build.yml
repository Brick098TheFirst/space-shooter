name: Build & Verify Space Unlimited

on:
  push:
    branches:
      - overhall-test

  pull_request:
    branches:
      - overhall-test

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: space-unlimited-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Build GBA ROM and Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      # ── CHECKOUT ───────────────────────────────────────────────────────
      - name: Check out repository
        uses: actions/checkout@v4

      # ── NODE AND PYTHON ────────────────────────────────────────────────
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Node dependencies
        run: npm ci

      # ── VALIDATION AND TESTS ───────────────────────────────────────────
      - name: Validate source assets
        run: python3 tools/validate-assets.py

      - name: Generate GBA assets
        run: npm run generate-assets

      - name: Verify campaign, saves, menus, and web shell
        run: npm test

      # ── GBA AND WEB BUILD ──────────────────────────────────────────────
      - name: Build GBA ROM and browser player
        run: npm run build

      - name: Verify GBA ROM
        shell: bash
        run: |
          if [ ! -f SpaceUnlimited.gba ]; then
            echo "SpaceUnlimited.gba was not created."
            exit 1
          fi

          ROM_SIZE="$(wc -c < SpaceUnlimited.gba)"

          if [ "$ROM_SIZE" -le 0 ]; then
            echo "SpaceUnlimited.gba is empty."
            exit 1
          fi

          echo "GBA ROM size: $ROM_SIZE bytes"

      - name: Boot ROM in headless mGBA
        run: node tools/smoke_gba.mjs --frames 3600

      - name: Verify browser distribution
        shell: bash
        run: |
          test -f web/dist/emulator-bundle.js
          test -f web/dist/mgba_libretro.wasm
          test -f web/dist/SpaceUnlimited.gba

          node --check server.js
          node --check web/src/emulator-client.js
          node --check web/sw.js

      # ── ANDROID TOOLCHAIN ──────────────────────────────────────────────
      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ── ANDROID VERSION ────────────────────────────────────────────────
      - name: Calculate Android version
        shell: bash
        run: |
          VERSION_CODE=$((2000000000 + GITHUB_RUN_NUMBER * 10 + GITHUB_RUN_ATTEMPT))
          VERSION_NAME="2.0.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"

          if [ "$VERSION_CODE" -gt 2100000000 ]; then
            echo "Android versionCode limit exceeded: $VERSION_CODE"
            exit 1
          fi

          echo "ANDROID_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

          echo "Android version: $VERSION_NAME"
          echo "Android versionCode: $VERSION_CODE"

      # ── ANDROID APK BUILD ──────────────────────────────────────────────
      # This creates an installable debug APK for the Actions artifact.
      # It does not create a GitHub Release.
      - name: Build Android APK
        env:
          EOS_PRODUCT_ID: ${{ secrets.EOS_PRODUCT_ID }}
          EOS_SANDBOX_ID: ${{ secrets.EOS_SANDBOX_ID }}
          EOS_DEPLOYMENT_ID: ${{ secrets.EOS_DEPLOYMENT_ID }}
          EOS_CLIENT_ID: ${{ secrets.EOS_CLIENT_ID }}
          EOS_CLIENT_SECRET: ${{ secrets.EOS_CLIENT_SECRET }}
        shell: bash
        run: |
          cd android
          chmod +x gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Collect Android APK
        shell: bash
        run: |
          APK_SOURCE="android/app/build/outputs/apk/debug/app-debug.apk"
          APK_OUTPUT="SpaceUnlimited-Multiplayer.apk"

          if [ ! -f "$APK_SOURCE" ]; then
            echo "Android APK was not created at $APK_SOURCE"
            exit 1
          fi

          cp "$APK_SOURCE" "$APK_OUTPUT"

          APK_SIZE="$(wc -c < "$APK_OUTPUT")"

          if [ "$APK_SIZE" -le 0 ]; then
            echo "Android APK is empty."
            exit 1
          fi

          echo "Android APK version: $ANDROID_VERSION_NAME"
          echo "Android APK versionCode: $ANDROID_VERSION_CODE"
          echo "Android APK size: $APK_SIZE bytes"

      # ── ACTIONS ARTIFACT ───────────────────────────────────────────────
      # This only attaches files to the workflow run for 14 days.
      # It does not create a GitHub Release or Git tag.
      - name: Upload GBA and Android builds
        uses: actions/upload-artifact@v4
        with:
          name: SpaceUnlimited-2.0-${{ github.run_number }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
          path: |
            SpaceUnlimited.gba
            SpaceUnlimited-Multiplayer.apk
