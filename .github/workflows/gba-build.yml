name: Build & Verify Space Unlimited

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: space-unlimited-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Build GBA ROM & Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      # ── 1. CHECKOUT ──────────────────────────────────────────────────
      - name: Check out repository
        uses: actions/checkout@v4

      # ── 2. NODE / PYTHON ─────────────────────────────────────────────
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: npm ci

      # ── 3. RELEASE VERIFICATION ──────────────────────────────────────
      - name: Validate source assets
        run: python3 tools/validate-assets.py

      - name: Generate GBA assets
        run: npm run generate-assets

      - name: Verify campaign, saves, menus, and web shell
        run: npm test

      # ── 4. GBA + WEB BUILD ───────────────────────────────────────────
      - name: Build GBA ROM and browser player
        run: npm run build

      - name: Verify GBA ROM
        run: |
          test -f SpaceUnlimited.gba

          ROM_SIZE="$(wc -c < SpaceUnlimited.gba)"

          if [ "$ROM_SIZE" -le 0 ]; then
            echo "GBA ROM is empty."
            exit 1
          fi

          echo "GBA ROM size: $ROM_SIZE bytes"

      - name: Boot ROM in headless mGBA
        run: node tools/smoke_gba.mjs --frames 3600

      - name: Verify browser distribution
        run: |
          test -f web/dist/emulator-bundle.js
          test -f web/dist/mgba_libretro.wasm
          test -f web/dist/SpaceUnlimited.gba

          node --check server.js
          node --check web/src/emulator-client.js
          node --check web/sw.js

      # ── 5. ANDROID TOOLCHAIN ─────────────────────────────────────────
      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Calculate Android version
        shell: bash
        run: |
          VERSION_CODE=$(
            (
              2000000000
              + GITHUB_RUN_NUMBER * 10
              + GITHUB_RUN_ATTEMPT
            )
          )

          VERSION_NAME="2.0.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"

          if [ "$VERSION_CODE" -gt 2100000000 ]; then
            echo "Android versionCode limit exceeded: $VERSION_CODE"
            exit 1
          fi

          echo "ANDROID_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

          echo "Android version: $VERSION_NAME"
          echo "Android versionCode: $VERSION_CODE"

      # ── 6. ANDROID RELEASE APK ───────────────────────────────────────
      - name: Build signed Android release APK
        env:
          EOS_PRODUCT_ID: ${{ secrets.EOS_PRODUCT_ID }}
          EOS_SANDBOX_ID: ${{ secrets.EOS_SANDBOX_ID }}
          EOS_DEPLOYMENT_ID: ${{ secrets.EOS_DEPLOYMENT_ID }}
          EOS_CLIENT_ID: ${{ secrets.EOS_CLIENT_ID }}
          EOS_CLIENT_SECRET: ${{ secrets.EOS_CLIENT_SECRET }}
        run: |
          cd android

          chmod +x gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleRelease

      - name: Collect Android APK
        run: |
          APK_SOURCE="android/app/build/outputs/apk/release/app-release.apk"
          APK_OUTPUT="SpaceUnlimited-Multiplayer.apk"

          test -f "$APK_SOURCE"

          cp "$APK_SOURCE" "$APK_OUTPUT"

          APK_SIZE="$(wc -c < "$APK_OUTPUT")"

          if [ "$APK_SIZE" -le 0 ]; then
            echo "Android APK is empty."
            exit 1
          fi

          echo "Android APK version: $ANDROID_VERSION_NAME"
          echo "Android APK versionCode: $ANDROID_VERSION_CODE"
          echo "Android APK size: $APK_SIZE bytes"

      # ── 7. TEMPORARY ACTIONS ARTIFACT ────────────────────────────────
      # This does NOT create a GitHub Release or tag.
      # The files are available only from this workflow run.
      - name: Upload verified builds
        uses: actions/upload-artifact@v4
        with:
          name: SpaceUnlimited-2.0-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
          path: |
            SpaceUnlimited.gba
            SpaceUnlimited-Multiplayer.apk
