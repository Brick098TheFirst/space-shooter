name: Build Windows game

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore SpaceUnlimited.sln

      - name: Build
        run: dotnet build SpaceUnlimited.sln --configuration Release --no-restore

      - name: Publish portable Windows x64 game
        shell: pwsh
        run: |
          dotnet publish .\SpaceUnlimited.Windows\SpaceUnlimited.Windows.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            --output .\publish

          Compress-Archive `
            -Path .\publish\* `
            -DestinationPath .\SpaceUnlimited-win-x64.zip `
            -CompressionLevel Optimal

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: SpaceUnlimited-win-x64
          path: SpaceUnlimited-win-x64.zip
          if-no-files-found: error
          retention-days: 30
