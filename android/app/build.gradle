import java.util.Locale
import java.util.Properties

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

/*
 * Epic's Android SDK is checked in as SDK.zip at the repository root. Keep the
 * expanded 55+ MB native binaries out of Git: Gradle expands them into its
 * ignored build directory when configuration starts. CMake links the matching
 * ABI from the AAR and Gradle packages the AAR's Java/Android integration.
 */
def eosArchive = rootProject.file('../SDK.zip')
def eosExtractDir = new File(rootProject.buildDir, 'eos-sdk-1.19.1.2')
def eosAar = new File(eosExtractDir, 'Bin/Android/static-stdc++/aar/eossdk-StaticSTDC-release.aar')
def eosJniDir = new File(eosExtractDir, 'aar-native')
def eosArm64Lib = new File(eosJniDir, 'jni/arm64-v8a/libEOSSDK.so')

if (!eosArchive.exists()) {
    throw new GradleException('Missing SDK.zip at the repository root. Download the Epic Online Services Android SDK 1.19.1.2.')
}
if (!eosAar.exists() || eosAar.lastModified() < eosArchive.lastModified()) {
    delete eosExtractDir
    copy {
        from zipTree(eosArchive)
        into eosExtractDir
    }
}
if (!eosArm64Lib.exists() || eosArm64Lib.lastModified() < eosAar.lastModified()) {
    delete eosJniDir
    copy {
        from zipTree(eosAar)
        include 'jni/**'
        into eosJniDir
    }
}

/* Credentials can come from an ignored local file or GitHub Actions secrets. */
def eosProperties = new Properties()
def eosPropertiesFile = rootProject.file('eos.properties')
if (eosPropertiesFile.exists()) {
    eosPropertiesFile.withInputStream { eosProperties.load(it) }
}
def eosValue = { String propertyName, String environmentName ->
    (eosProperties.getProperty(propertyName) ?: System.getenv(environmentName) ?: '').trim()
}
def productId = eosValue('productId', 'EOS_PRODUCT_ID')
def sandboxId = eosValue('sandboxId', 'EOS_SANDBOX_ID')
def deploymentId = eosValue('deploymentId', 'EOS_DEPLOYMENT_ID')
def clientId = eosValue('clientId', 'EOS_CLIENT_ID')
def clientSecret = eosValue('clientSecret', 'EOS_CLIENT_SECRET')
def eosConfigured = [productId, sandboxId, deploymentId, clientId, clientSecret].every { !it.isEmpty() }
def javaString = { String value -> '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"' }

/* GitHub Actions supplies a new build number on every run. The high base keeps
 * CI builds newer than the old versionCode 1 APK and than ordinary local
 * builds, while still staying below Android's 2,100,000,000 limit. */
def appVersionCode = (System.getenv('ANDROID_VERSION_CODE') ?: '2000000000') as int
def appVersionName = System.getenv('ANDROID_VERSION_NAME') ?: '1.0.local'

android {
    namespace 'com.brick.spaceshooter'
    compileSdk 34

    /* CI runners otherwise create a different ~/.android/debug.keystore each
     * time, making Android reject the next APK even with a higher versionCode.
     * This repository-owned DEBUG identity is intentionally public and gives
     * all downloadable debug builds the same update-compatible signature. */
    signingConfigs {
        debug {
            storeFile file('space-unlimited-debug.p12')
            storePassword 'spaceunlimited'
            keyAlias 'space-unlimited'
            keyPassword 'spaceunlimited'
            storeType 'PKCS12'
        }
    }

    defaultConfig {
        // This multiplayer build is the repository's primary Android app.
        applicationId "com.brick.spaceshooter"
        // EOS Android SDK 1.19.1.2 supports API 26+ and 64-bit ABIs.
        minSdk 26
        targetSdk 34
        versionCode appVersionCode
        versionName appVersionName
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared",
                    "-DEOS_INCLUDE_DIR=${new File(eosExtractDir, 'Include').absolutePath}",
                    "-DEOS_LIBRARY_DIR=${new File(eosJniDir, 'jni').absolutePath}"
            }
        }

        buildConfigField 'boolean', 'EOS_CONFIGURED', eosConfigured.toString()
        buildConfigField 'String', 'EOS_PRODUCT_ID', javaString(productId)
        buildConfigField 'String', 'EOS_SANDBOX_ID', javaString(sandboxId)
        buildConfigField 'String', 'EOS_DEPLOYMENT_ID', javaString(deploymentId)
        buildConfigField 'String', 'EOS_CLIENT_ID', javaString(clientId)
        buildConfigField 'String', 'EOS_CLIENT_SECRET', javaString(clientSecret)

        // Required by the EOS AAR manifest for a future Account Portal login.
        // Device-ID login does not open this URI, but the manifest must resolve it.
        def loginClient = clientId.isEmpty() ? 'unconfigured.spaceunlimited' : clientId.toLowerCase(Locale.ROOT)
        resValue 'string', 'eos_login_protocol_scheme', "eos.${loginClient}"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding false
        buildConfig true
    }
    packagingOptions {
        jniLibs {
            // The same EOS binary is visible through both the AAR and CMake.
            pickFirsts += ['**/libEOSSDK.so']
        }
    }
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
}

dependencies {
    implementation files(eosAar)

    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'

    // Runtime dependencies required by Epic's Android AAR.
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.security:security-crypto:1.0.0'
    implementation 'androidx.browser:browser:1.4.0'
    implementation 'androidx.webkit:webkit:1.7.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
