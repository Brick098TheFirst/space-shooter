plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.brick.spaceshooter'
    compileSdk 34

    defaultConfig {
        applicationId "com.brick.spaceshooter"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding false
    }
}

// Package the same GBA ROM + web mGBA player the rest of the repo uses.
def repoRoot = rootProject.projectDir.parentFile
tasks.register('syncGbaPlayerAssets', Copy) {
    from("${repoRoot}/android/www/index.html")
    from("${repoRoot}/web/dist") {
        include 'emulator-bundle.js'
        include 'mgba_libretro.wasm'
        include 'SpaceUnlimited.gba'
    }
    from("${repoRoot}/SpaceUnlimited.gba")
    into("${projectDir}/src/main/assets/www")
}

tasks.named('preBuild').configure { dependsOn('syncGbaPlayerAssets') }

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.11.0'
}
