<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Space Unlimited: Recharged</title>
  <style>
    :root {
      --accent-cyan: #23d6ff;
      --gba-body: #4a3e75;
      --gba-body-dark: #372e5c;
      --gba-rim: #5f5096;
      --gba-bezel: #181920;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #050810; color: #f0f6ff; font-family: system-ui, sans-serif; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .shell {
      display: flex; flex-direction: row; align-items: center; justify-content: space-between;
      width: 100%; height: 100%; padding: 8px 12px; gap: 8px;
      background: linear-gradient(145deg, var(--gba-rim) 0%, var(--gba-body) 40%, var(--gba-body-dark) 100%);
    }
    .col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; flex: 0 0 auto; }
    .screen-wrap {
      flex: 1 1 auto; height: 100%; max-height: 100%;
      display: flex; align-items: center; justify-content: center;
      background: var(--gba-bezel); border-radius: 10px; padding: 8px; position: relative; min-width: 0;
    }
    .screen-canvas-wrap { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    canvas#gba-screen {
      width: auto; height: 100%; max-width: 100%;
      image-rendering: pixelated; image-rendering: crisp-edges; display: block; background: #000;
    }
    .start-prompt-overlay {
      position: absolute; inset: 0; background: rgba(4, 8, 20, 0.9);
      display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10;
    }
    .start-prompt-overlay.hidden { display: none; }
    .play-btn-circle {
      width: 64px; height: 64px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-cyan), #0088cc);
      display: flex; align-items: center; justify-content: center; margin-bottom: 10px;
    }
    .play-btn-circle svg { width: 28px; height: 28px; fill: #040814; margin-left: 4px; }
    .start-prompt-text { font-weight: 700; }
    .dpad { position: relative; width: 110px; height: 110px; }
    .dpad-btn { position: absolute; background: #282730; border: 1px solid #1a1920; }
    .dpad-btn:active, .dpad-btn.pressed { background: #181720; }
    .dpad-btn.up { top: 0; left: 38px; width: 34px; height: 40px; border-radius: 6px 6px 0 0; }
    .dpad-btn.down { bottom: 0; left: 38px; width: 34px; height: 40px; border-radius: 0 0 6px 6px; }
    .dpad-btn.left { top: 38px; left: 0; width: 40px; height: 34px; border-radius: 6px 0 0 6px; }
    .dpad-btn.right { top: 38px; right: 0; width: 40px; height: 34px; border-radius: 0 6px 6px 0; }
    .dpad-center { position: absolute; top: 38px; left: 38px; width: 34px; height: 34px; background: #282730; border-radius: 50%; }
    .action-btn {
      width: 52px; height: 52px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.15);
      font-weight: 800; color: #fff; font-size: 16px;
    }
    .action-btn:active, .action-btn.pressed { transform: translateY(2px); }
    .a-btn { background: linear-gradient(145deg, #3680a6, #1e4d66); }
    .b-btn { background: linear-gradient(145deg, #a64436, #66261e); }
    .sys-row, .shoulder-row { display: flex; gap: 10px; }
    .sys-btn, .shoulder {
      min-width: 44px; height: 22px; border-radius: 8px; background: #282730; color: #99a; font-size: 10px; font-weight: 700; border: 0; padding: 0 8px;
    }
    .sys-btn:active, .shoulder:active, .sys-btn.pressed, .shoulder.pressed { background: #181720; }
    .status { font-size: 10px; color: #89a; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="shell">
    <div class="col">
      <div class="shoulder-row">
        <button class="shoulder" id="btn-l">L</button>
      </div>
      <div class="dpad">
        <button class="dpad-btn up" id="dpad-up"></button>
        <button class="dpad-btn down" id="dpad-down"></button>
        <button class="dpad-btn left" id="dpad-left"></button>
        <button class="dpad-btn right" id="dpad-right"></button>
        <div class="dpad-center"></div>
      </div>
      <div class="sys-row">
        <button class="sys-btn" id="btn-select">SELECT</button>
        <button class="sys-btn" id="btn-start">START</button>
      </div>
    </div>

    <div class="screen-wrap">
      <div class="screen-canvas-wrap">
        <canvas id="gba-screen" width="240" height="160"></canvas>
        <div class="start-prompt-overlay" id="start-overlay">
          <div class="play-btn-circle">
            <svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>
          </div>
          <div class="start-prompt-text">Tap to Play</div>
          <div class="status" id="status-text">Same GBA ROM as the web player</div>
        </div>
      </div>
    </div>

    <div class="col">
      <div class="shoulder-row">
        <button class="shoulder" id="btn-r">R</button>
      </div>
      <div style="display:flex;gap:14px;transform:rotate(-18deg);">
        <button class="action-btn b-btn" id="btn-b">B</button>
        <button class="action-btn a-btn" id="btn-a">A</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { GbaPlayer } from "./emulator-bundle.js";

    const canvas = document.getElementById("gba-screen");
    const startOverlay = document.getElementById("start-overlay");
    const statusText = document.getElementById("status-text");

    const player = new GbaPlayer(canvas, {
      onFpsUpdate: (fps) => { statusText.textContent = `${fps} FPS`; },
      onStatusChange: (msg) => { statusText.textContent = msg; }
    });

    startOverlay.addEventListener("click", async () => {
      startOverlay.classList.add("hidden");
      player.initAudio();
      try {
        statusText.textContent = "Loading GBA ROM...";
        const resp = await fetch("SpaceUnlimited.gba");
        const arrayBuf = await resp.arrayBuffer();
        await player.loadRom(arrayBuf);
      } catch (err) {
        statusText.textContent = "Error: " + err.message;
        startOverlay.classList.remove("hidden");
      }
    });

    function bindVirtualBtn(elemId, btnId) {
      const elem = document.getElementById(elemId);
      if (!elem) return;
      const press = (e) => { e.preventDefault(); elem.classList.add("pressed"); player.setVirtualButton(btnId, true); };
      const release = (e) => { e.preventDefault(); elem.classList.remove("pressed"); player.setVirtualButton(btnId, false); };
      elem.addEventListener("mousedown", press);
      elem.addEventListener("mouseup", release);
      elem.addEventListener("mouseleave", release);
      elem.addEventListener("touchstart", press, { passive: false });
      elem.addEventListener("touchend", release, { passive: false });
      elem.addEventListener("touchcancel", release, { passive: false });
    }

    bindVirtualBtn("dpad-up", 4);
    bindVirtualBtn("dpad-down", 5);
    bindVirtualBtn("dpad-left", 6);
    bindVirtualBtn("dpad-right", 7);
    bindVirtualBtn("btn-a", 8);
    bindVirtualBtn("btn-b", 0);
    bindVirtualBtn("btn-l", 10);
    bindVirtualBtn("btn-r", 11);
    bindVirtualBtn("btn-start", 3);
    bindVirtualBtn("btn-select", 2);
  </script>
</body>
</html>
